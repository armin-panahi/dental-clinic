<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کلینیک دندان پزشکی</title>
    <link rel="stylesheet" href="./src/styles/normalize.css" />
    <link rel="stylesheet" href="./src/styles/style.css" />
    <link rel="stylesheet" href="./src/styles/mobile-sticky-menu.css">
  </head>
  <body>
    <header>
      <div class="brand">
        <svg
          class="logo-icon"
          viewBox="0 0 120 120"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
        >
          <defs>
            <linearGradient
              id="toothGradient"
              x1="20"
              y1="10"
              x2="100"
              y2="110"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0%" stop-color="#55C8F5" />
              <stop offset="100%" stop-color="#1677D2" />
            </linearGradient>
          </defs>

          <!-- Tooth -->
          <path
            d="M60 18
                   C43 7 17 17 17 43
                   C17 62 29 76 34 96
                   C38 113 49 113 54 96
                   L60 77
                   L66 96
                   C71 113 82 113 86 96
                   C91 76 103 62 103 43
                   C103 17 77 7 60 18Z"
            fill="white"
            stroke="url(#toothGradient)"
            stroke-width="6"
            stroke-linejoin="round"
          />

          <!-- Medical Cross -->
          <path
            d="M87 13V35M76 24H98"
            stroke="#43BCEB"
            stroke-width="7"
            stroke-linecap="round"
          />

          <!-- Smile / Orbit -->
          <path
            d="M15 68
                   C36 91 78 92 108 62"
            stroke="#42BCEB"
            stroke-width="5"
            stroke-linecap="round"
          />

          <!-- Sparkle -->
          <path
            d="M15 17V29M9 23H21"
            stroke="#55C8F5"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </header>

    <nav class="mobile-nav" aria-label="منوی اصلی موبایل">
        <a href="#about" class="mobile-nav__item">
        <span class="mobile-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="8" r="4" />
            <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
          </svg>
        </span>
        <span>پروفایل</span>
      </a>

      <a href="#contact" class="mobile-nav__item">
        <span class="mobile-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"
            />
          </svg>
        </span>
        <span>نوبت دهی</span>
      </a>

      <a href="#services" class="mobile-nav__item">
        <span class="mobile-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              d="M12 3 14.5 9.5 21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"
            />
          </svg>
        </span>
        <span>خدمات</span>
      </a>

      <a href="#home" class="mobile-nav__item active">
        <span class="mobile-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"
            />
          </svg>
        </span>
        <span>خانه</span>
      </a>
    </nav>
  </body>
</html>
